<!doctype html>
<html lang="en-GB" class="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ushers Admin</title>
<meta name="theme-color" content="#0b5f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ushers Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* The theme, set before the first paint (as the Driver App): Light, Dark, or
   Auto to follow the phone. One setting for both apps on this phone. */
(function () {
  var t = "auto";
  try { t = localStorage.getItem("ushers.theme.v1") || "auto"; } catch (e) {}
  var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  document.documentElement.setAttribute("data-theme", t !== "auto" ? t : ((m && m.matches) ? "dark" : "light"));
})();
</script>
<link rel="stylesheet" href="../shared/style.css">
<script src="../config.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/reports.js"></script>
<script src="testing.js"></script>
</head>
<body>
<!-- Every screen is read from the server as it opens. With no signal the
     page comes from the service worker at the root (../sw.js) and each
     screen from what this device saved, as the Ushers App. -->
<div class="top">
<header class="bar">
  <span class="brand"><img src="../shared/logo.png" alt=""><span><b>RCCG Dominion Assembly</b><small>Liverpool · Ushering Admin</small><em id="title"></em></span></span>
  <a href="../">Open Ushers App</a>
  <button id="signOut" hidden>Sign out</button>
  <button class="bell" id="bell" type="button" hidden aria-label="Notifications" aria-pressed="false"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-count" id="bellCount" hidden></span></button>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<div class="banner" id="queueBanner" hidden></div>
<div class="banner" id="linkBar" hidden></div>
</div>
<main id="main"></main>
<footer class="foot" id="foot"></footer>
<button class="totop" id="toTop" type="button" aria-label="Back to top">&#8593;</button>
<script>
(function () {
  "use strict";
  var C = window.UshersCore, R = window.UshersReports, h = C.h, main = document.getElementById("main");
  var ME = null, CONF = null, PUSH_KEY = "", timer = null;
  /* Each screen and the permission the server needs for it. The server
     refuses anyway; this only decides what is offered. */
  var SCREENS = [
    ["dashboard", "Dashboard", "dashboard.view"],
    ["notes", "Notifications", "admin.app"],
    ["rota", "Rota", "rota.manage"],
    ["events", "Events", "events.manage"],
    ["reports", "Reports", "reports.view_all"],
    ["approvals", "Approvals", "exceptions.approve"],
    ["ushers", "Ushers", "ushers.view"],
    ["message", "Message", "notifications.send"],
    ["audit", "Audit", "audit.view"],
    ["settings", "Settings", "config.manage"]
  ];
  function can(p) { return ME && ME.permissions.indexOf(p) !== -1; }
  function msg(text, kind) { return h("div", { class: "msg " + (kind || "") }, text); }
  function show() {
    C.clear(main);
    main.appendChild(h.apply(null, ["div", {}, queueCard()].concat(Array.prototype.slice.call(arguments))));
    C.foot(document.getElementById("foot"));
  }
  function loading() { show(h("p", { class: "muted" }, "Loading…")); }
  function failed(e) { show(msg(e && e.network ? "No connection, and this screen has not been opened on this device before. It shows once the signal is back." : String(e && e.message || e), "bad")); }
  function money(p) { return C.money(p); }
  function chip(code, label) { return h("span", { class: "chip status-" + (code || "") }, label || "Not started"); }
  function pinInput(id) { return h("input", { id: id, type: "password", inputmode: "numeric", maxlength: "4", pattern: "[0-9]*", class: "pin" }); }

  C.onSignedOut = function () { C.setToken(""); signIn(); };
  C.onQueueChange = paintQueue;

  /* Changes made with no signal, waiting on this device, as the Ushers
     App's Home: one refused by the server stays, with why, until removed. */
  function paintQueue() {
    var q = C.queue(), b = document.getElementById("queueBanner");
    b.hidden = !q.length;
    b.textContent = q.length ? q.length + " saved on this device, waiting for connection" +
      (q.some(function (x) { return x.lastError; }) ? ". One was refused: see why at the top of the page." : "") : "";
  }
  function queueCard() {
    var q = C.queue();
    if (!q.length) return null;
    return h("div", { class: "card" }, h("b", {}, "Saved on this device, waiting for connection"),
      q.map(function (x) {
        return h("div", { class: "row" }, h("span", { class: "grow" }, x.label),
          x.lastError ? h("span", { class: "chip bad" }, x.lastError) : h("span", { class: "chip warn" }, "Waiting"),
          x.lastError ? h("button", { class: "ghost", onclick: function () { C.queueRemove(x.id); paintQueue(); route(); } }, "Remove") : null);
      }), h("button", { class: "ghost", onclick: function () { C.flush().then(function () { paintQueue(); route(); }); } }, "Try again now"));
  }

  /* Sign in here as well as on the Ushers App: the same people, PINs and
     session, so signing in on either app signs you in on both. */
  function signIn() {
    ME = null;
    C.bellStop();
    document.getElementById("tabs").hidden = true;
    document.getElementById("signOut").hidden = true;
    document.getElementById("title").textContent = "";
    var who = h("select", { id: "who" }, h("option", { value: "" }, "Choose your name"));
    var typed = h("input", { id: "whoTyped", placeholder: "e.g. John Smith", autocomplete: "name", hidden: true });
    var pin = h("input", { id: "pin", type: "password", inputmode: "numeric", autocomplete: "current-password", maxlength: "4", pattern: "[0-9]*", class: "pin" });
    var out = h("div");
    var go = h("button", { onclick: function () {
      out.textContent = "";
      var body = { pin: pin.value };
      if (!typed.hidden) body.name = typed.value; else body.usherId = who.value;
      if ((!body.usherId && !body.name) || !pin.value) { out.appendChild(msg("Choose your name and enter your PIN.", "bad")); return; }
      go.disabled = true;
      C.api("login", body).then(function (j) {
        go.disabled = false;
        if (!j.ok) { out.appendChild(msg(j.message + (j.left !== undefined ? " " + j.left + " tries left." : ""), "bad")); return; }
        C.setToken(j.token);
        start();
      }, function () { go.disabled = false; out.appendChild(msg("No connection. Try again when you have signal.", "bad")); });
    } }, "Sign in");
    show(h("h1", {}, "Sign in to Admin"),
      h("div", { class: "card" }, h("label", { for: "who" }, "Your name"), who, typed, h("label", { for: "pin" }, "PIN"), pin, h("p"), go, out));
    C.api("people", { app: "admin" }).then(function (j) {
      if (j.firstSetup) { C.clear(out); out.appendChild(msg("Nobody is set up yet. Open the Ushers App for First-time setup.")); return; }
      if (j.typeName) { who.hidden = true; typed.hidden = false; return; }
      (j.people || []).forEach(function (p) { who.appendChild(h("option", { value: p.id }, p.name)); });
    }, function () { who.hidden = true; typed.hidden = false; });
  }

  function start() {
    if (!C.token()) return signIn();
    C.api("me").then(function (j) {
      if (!j.ok) return start();
      ME = j.me; CONF = j.config; PUSH_KEY = j.pushKey || "";
      /* Just given the default PIN: the Ushers App asks whether to change it. */
      if (ME.askPinChange) { location.href = "../"; return; }
      document.getElementById("signOut").hidden = false;
      if (!can("admin.app")) return show(h("h1", {}, "Not available"), msg("The Admin App is for the Head Usher and Assistant Head Usher. Everything else, the Treasurer's page included, is in the Ushers App."), h("a", { class: "btn", href: "../" }, "Open Ushers App"));
      document.getElementById("title").textContent = ME.name;
      document.getElementById("signOut").hidden = false;
      var tabs = document.getElementById("tabs");
      C.clear(tabs);
      SCREENS.filter(function (s) { return can(s[2]); }).forEach(function (s) {
        tabs.appendChild(h("a", { href: "#" + s[0], "data-r": s[0] }, s[1], s[0] === "notes" ? h("span", { class: "badge", id: "unread", hidden: true }) : null));
      });
      tabs.hidden = false;
      paintQueue();
      C.flush();
      route();
      /* The bell, as in the Ushers App: alerts on this device, the unread
         count, and anything new shown while the app is open. */
      C.bellStart({ key: PUSH_KEY, notes: "#notes", onNew: function () {
        if ((location.hash || "").slice(1).split("/")[0] === "notes") notes();
      } });
    }, failed);
  }
  document.getElementById("signOut").addEventListener("click", function () {
    C.api("logout").then(function () {}, function () {}).then(function () { C.setToken(""); signIn(); });
  });

  function route() {
    if (!ME) return;
    if (timer) { clearInterval(timer); timer = null; }
    var allowed = SCREENS.filter(function (s) { return can(s[2]); });
    var parts = (location.hash || "").slice(1).split("/");
    var name = parts[0];
    if (!allowed.some(function (s) { return s[0] === name; })) name = allowed.length ? allowed[0][0] : "";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs a"), function (a) { a.className = a.getAttribute("data-r") === name ? "on" : ""; });
    var fn = { dashboard: dashboard, rota: rota, events: events, reports: reports, approvals: approvals, ushers: ushers,
               message: message, audit: audit, settings: settings, notes: notes, report: function () { reportView(parts[1]); } }[parts[0] === "report" ? "report" : name];
    if (fn) fn(parts[1]); else show(msg("Nothing here for your roles."));
  }
  window.addEventListener("hashchange", route);

  /* ---- dashboard -------------------------------------------------------- */

  function attendanceStats(a) {
    return h("div", { class: "grid4" }, [["Male", a.male], ["Female", a.female], ["Children", a.children], ["Total", a.total]]
      .map(function (x) { return h("div", { class: "stat" }, h("b", {}, x[1]), h("span", {}, x[0])); }));
  }
  function offeringTable(by, total) {
    return h("table", {}, CONF.offeringCategories.map(function (c) { return h("tr", {}, h("td", {}, c), h("td", { class: "num" }, money(by[c] || 0))); }),
      h("tr", {}, h("td", {}, h("b", {}, "Total")), h("td", { class: "num total" }, money(total))));
  }
  function rotaCard(s, title) {
    return h("div", { class: "card" }, h("div", { class: "row" }, h("h2", { class: "grow" }, title + ": " + C.dateLabel(s.sunday)),
        s.thanksgiving ? h("span", { class: "chip" }, "Thanksgiving Sunday") : null),
      s.services.map(function (sv) {
        return h("div", {}, h("h3", {}, sv.title), sv.people.length ? h("div", { class: "people" }, sv.people.map(function (p) { return h("div", {}, p.name); }))
          : h("div", { class: "muted" }, sv.type === "SUN_SECOND" ? "Counters not appointed" : "Nobody on the rota yet"));
      }), can("rota.manage") ? h("a", { class: "btn ghost", href: "#rota/" + s.sunday }, "Edit rota") : null);
  }

  function dashboard() {
    function load() {
      unread();
      C.api("dashboard").then(function (d) {
        if (!d.ok) return show(msg(d.message, "bad"));
        var cur = d.current, rep = cur.reporting;
        var parts = [h("h1", {}, d.currentLabel + ": " + C.dateLabel(cur.sunday) + (cur.thanksgiving ? " · Thanksgiving" : ""))];
        parts.push(h("div", { class: "card" }, h("h2", {}, "Needs your attention"), h("div", { class: "grid4" },
          [["Reports received", rep.received], ["Reports outstanding", rep.outstanding], ["Countersignatures pending", rep.pendingCountersignature], ["Approval requests", rep.approvalRequests]]
            .map(function (x) { return h("div", { class: "stat" }, h("b", {}, x[1]), h("span", {}, x[0])); })),
          rep.approvalRequests && can("exceptions.approve") ? h("p", {}, h("a", { class: "btn", href: "#approvals" }, "Review approvals")) : null));
        parts.push(h("div", { class: "card" }, h("h2", {}, "Attendance"), attendanceStats(cur.totals.attendance)));
        parts.push(h("div", { class: "card" }, h("h2", {}, "Offering"), offeringTable(cur.totals.offering, cur.totals.offeringTotal)));
        var mf = (cur.ministrationFields || [])[0];
        parts.push(h("div", { class: "card" }, h("h2", {}, "Services"), cur.services.map(function (s) {
          return h("div", {}, h("div", { class: "row" }, h("span", { class: "grow" }, s.title), chip(s.reportStatus, s.reportStatusLabel),
              s.version > 1 ? h("span", { class: "chip" }, "Amended") : null,
              s.reportId ? h("a", { class: "btn ghost", href: "#report/" + s.reportId }, "View") : null),
            s.ministration && mf && s.ministration[mf.key] ? h("div", { class: "muted" }, mf.label + ": " + s.ministration[mf.key]) : null);
        })));
        parts.push(rotaCard(d.next, "Next Sunday"));
        if (d.olderOutstanding.length) {
          parts.push(h("div", { class: "card" }, h("h2", {}, "Older reports not submitted"), d.olderOutstanding.map(function (e) {
            return h("div", {}, C.dateLabel(e.date) + " · " + e.title);
          })));
        }
        if (d.otherEvents.length) {
          parts.push(h("div", { class: "card" }, h("h2", {}, "Other events coming up"), d.otherEvents.map(function (e) {
            return h("div", {}, C.dateLabel(e.date) + " · " + e.title + " · " + e.people.length + " on duty");
          })));
        }
        parts.push(h("p", { class: "muted" }, d._savedAt ? "Saved on this device " + C.timeLabel(d._savedAt) : "Updated " + new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" })));
        show.apply(null, parts);
      }, failed);
    }
    loading(); load();
    timer = setInterval(load, (C.CFG.refreshSeconds || 30) * 1000);
  }

  /* ---- rota ------------------------------------------------------------- */

  var USHERS = null;
  function activeUshers() {
    if (USHERS) return Promise.resolve(USHERS);
    return C.api("ushers.list").then(function (j) { USHERS = (j.ushers || []).filter(function (u) { return u.active; }); return USHERS; });
  }

  function picker(sv, people, exact) {
    var chosen = {};
    sv.people.forEach(function (p) { chosen[p.usherId] = true; });
    var count = h("span", { class: "chip" });
    function paint() { var n = Object.keys(chosen).filter(function (k) { return chosen[k]; }).length; count.textContent = n + (exact ? " of " + exact : "") + " chosen"; }
    var out = h("div");
    var box = h("div", { class: "card" }, h("div", { class: "row" }, h("h3", { class: "grow" }, sv.title), count),
      exact ? h("div", { class: "muted" }, "Exactly " + exact + " offering counters.") : h("div", { class: "muted" }, "Choose who is on duty."),
      h("div", { class: "people" }, people.map(function (u) {
        return h("label", { class: "check" }, h("input", { type: "checkbox", checked: !!chosen[u.usherId], onchange: function (e) { chosen[u.usherId] = e.target.checked; paint(); } }), u.name);
      })),
      h("p"), h("button", { onclick: function () {
        var ids = Object.keys(chosen).filter(function (k) { return chosen[k]; });
        C.clear(out);
        C.send("rota.set", { eventId: sv.eventId, usherIds: ids }, "Rota for " + sv.title + (sv.date ? " · " + C.dateLabel(sv.date) : "")).then(function (j) {
          out.appendChild(j.queued ? msg(j.message, "ok") : j.ok ? msg("Saved.", "ok") : msg(j.message, "bad"));
        }, function () { out.appendChild(msg("No connection.", "bad")); });
      } }, "Save"), out);
    paint();
    return box;
  }

  function rota(sunday) {
    loading();
    var today = C.londonToday();
    var from = sunday || today;
    Promise.all([C.api("rota", { from: from, weeks: 1 }), activeUshers()]).then(function (r) {
      var j = r[0], people = r[1];
      if (!j.ok) return show(msg(j.message, "bad"));
      var s = j.sundays[0];
      var date = h("input", { type: "date", id: "sun", value: s.sunday });
      var parts = [h("h1", {}, "Rota"),
        h("div", { class: "card row" }, h("label", { for: "sun", class: "grow" }, "Sunday"), date,
          h("button", { class: "ghost", onclick: function () { location.hash = "#rota/" + addDays(s.sunday, -7); } }, "← Week"),
          h("button", { class: "ghost", onclick: function () { location.hash = "#rota/" + addDays(s.sunday, 7); } }, "Week →")),
        s.thanksgiving ? msg("Thanksgiving Sunday (first Sunday of the month).") : null];
      date.addEventListener("change", function () { if (date.value) location.hash = "#rota/" + date.value; });
      s.services.forEach(function (sv) { parts.push(picker(sv, people, sv.type === "SUN_SECOND" ? CONF.secondServiceCounters : 0)); });
      show.apply(null, parts.filter(Boolean));
    }, failed);
  }
  function addDays(key, n) {
    var d = new Date(Date.UTC(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10) + n));
    return d.toISOString().slice(0, 10);
  }

  /* ---- other events ----------------------------------------------------- */

  function events(eventId) {
    loading();
    Promise.all([C.api("rota", { from: addDays(C.londonToday(), -7), weeks: 12 }), activeUshers()]).then(function (r) {
      var j = r[0], people = r[1];
      var types = Object.keys(CONF.eventTypes).filter(function (k) { return !CONF.eventTypes[k].sunday; });
      var type = h("select", { id: "etype" }, types.map(function (k) { return h("option", { value: k }, CONF.eventTypes[k].label); }));
      var title = h("input", { id: "etitle", placeholder: "e.g. Naming Ceremony for the Okafor family" });
      var date = h("input", { id: "edate", type: "date" });
      var time = h("input", { id: "etime", type: "time" });
      var notes = h("input", { id: "enotes", placeholder: "e.g. Main hall" });
      var out = h("div");
      var parts = [h("h1", {}, "Events"), h("div", { class: "card" }, h("h2", {}, "New event"),
        h("label", { for: "etype" }, "Type"), type, h("label", { for: "etitle" }, "Title"), title,
        h("div", { class: "grid3" }, h("div", {}, h("label", { for: "edate" }, "Date"), date), h("div", {}, h("label", { for: "etime" }, "Start"), time), h("div")),
        h("label", { for: "enotes" }, "Notes"), notes, h("p"),
        h("button", { onclick: function () {
          C.clear(out);
          C.send("event.save", { type: type.value, title: title.value, date: date.value, start: time.value, notes: notes.value }, "New event: " + title.value).then(function (x) {
            if (!x.ok) return out.appendChild(msg(x.message, "bad"));
            if (x.queued) return out.appendChild(msg(x.message + " Choose who is on duty once it is in the list.", "ok"));
            location.hash = "#events/" + x.eventId;
          });
        } }, "Create"), out)];
      parts.push(h("h2", {}, "Coming up"));
      if (!j.events.length) parts.push(h("p", { class: "muted" }, "No other events in the next weeks."));
      j.events.forEach(function (e) {
        var card = h("div", { class: "card" }, h("div", { class: "row" }, h("b", { class: "grow" }, e.title), chip(e.reportStatus, e.reportStatus ? e.reportStatus.replace(/_/g, " ") : "No report")),
          h("div", { class: "muted" }, C.dateLabel(e.date) + (e.start ? " · " + e.start : "") + (e.status === "cancelled" ? " · cancelled" : "")),
          h("div", {}, e.people.map(function (p) { return p.name; }).join(", ") || "Nobody on duty yet"),
          h("div", { class: "row" }, h("a", { class: "btn ghost", href: "#events/" + e.eventId }, "Choose who is on duty"),
            h("button", { class: "ghost", onclick: function () { C.send("event.cancel", { eventId: e.eventId, restore: e.status === "cancelled" }, (e.status === "cancelled" ? "Restore " : "Cancel ") + e.title).then(function () { events(); }); } },
              e.status === "cancelled" ? "Restore" : "Cancel event")));
        parts.push(card);
        if (eventId === e.eventId) parts.push(picker(e, people, 0));
      });
      show.apply(null, parts);
    }, failed);
  }

  /* ---- reports ---------------------------------------------------------- */

  function reports(status) {
    loading();
    C.api("reports.list", { status: status || "" }).then(function (j) {
      var sel = h("select", { onchange: function (e) { location.hash = "#reports/" + e.target.value; } },
        [["", "All"], ["pending_countersignature", "Pending Countersignature"], ["verified", "Verified"], ["draft", "Draft"]].map(function (x) {
          return h("option", { value: x[0], selected: (status || "") === x[0] }, x[1]);
        }));
      show(h("h1", {}, "Reports"), periodCard(), sel, h("div", { class: "card" }, j.reports.length ? h("table", {},
        h("tr", {}, h("th", {}, "Date"), h("th", {}, "Event"), h("th", {}, "Status"), h("th", { class: "num" }, "People"), h("th", { class: "num" }, "Offering")),
        j.reports.map(function (r) {
          return h("tr", {}, h("td", {}, C.dateLabel(r.date)), h("td", {}, r.status === "draft" ? r.title : h("a", { href: "#report/" + r.id }, r.title)),
            h("td", {}, chip(r.status, r.statusLabel)), h("td", { class: "num" }, r.attendanceTotal), h("td", { class: "num" }, money(r.offeringTotal)));
        })) : h("p", { class: "muted" }, "None.")));
    }, failed);
  }

  /* A PDF of every service in a period, from the server's summary. */
  function periodCard() {
    var today = C.londonToday();
    var from = h("input", { id: "pfrom", type: "date", value: today.slice(0, 8) + "01" });
    var to = h("input", { id: "pto", type: "date", value: today });
    var out = h("div");
    var make = R.pdfButton("Make PDF summary", function (pdf, opt, p) { return pdf.period(p, CONF, opt); }, ME.name, function () {
      return C.api("reports.period", { from: from.value, to: to.value }).then(function (p) { if (!p.ok) throw new Error(p.message); return p; });
    });
    return h("div", { class: "card" }, h("h2", {}, "Summary for a period"),
      h("div", { class: "grid3" }, h("div", {}, h("label", { for: "pfrom" }, "From"), from), h("div", {}, h("label", { for: "pto" }, "To"), to)),
      h("p"), make, out);
  }

  function reportView(id) {
    loading();
    C.api("report.open", { reportId: id }).then(function (j) {
      if (!j.ok) return show(msg(j.message, "bad"));
      var r = j.report;
      show(h("h1", {}, j.event.title), h("p", { class: "muted" }, C.dateLabel(j.event.date)),
        h("div", { class: "row" }, chip(r.status, r.statusLabel), r.version > 1 ? h("span", { class: "chip" }, "Amended · version " + r.version) : null,
          R.pdfButton("PDF", function (pdf, opt) { return pdf.service(r, j.event, CONF, opt); }, ME.name)),
        h("div", { class: "card" }, h("div", {}, "Submitted by " + r.submitter + " · " + C.timeLabel(r.submittedAt)),
          r.countersignRequired ? h("div", {}, "Countersigner: " + (r.countersigner || "—") + (r.countersignedAt ? " · " + C.timeLabel(r.countersignedAt) : "")) : null),
        j.event.attendance ? h("div", { class: "card" }, h("h2", {}, "Attendance"), attendanceStats(r.attendance)) : null,
        j.event.ministration ? R.ministrationView(r.ministrationFields, r.ministration) : null,
        j.event.offering ? h("div", { class: "card" }, h("h2", {}, "Offering"),
          h("table", {}, r.entries.map(function (x) { return h("tr", {}, h("td", {}, x.category), h("td", { class: "num" }, C.denomLabel(x.denomination)), h("td", { class: "num" }, "× " + x.quantity), h("td", { class: "num" }, money(x.amount))); })),
          h("h3", {}, "Totals"), offeringTable(r.byCategory, r.offeringTotal)) : null,
        r.notes ? h("div", { class: "card" }, h("b", {}, "Notes"), h("div", {}, r.notes)) : null,
        r.amend && r.amend.possible ? h("div", { class: "card" }, h("h3", {}, "Amend this report"),
          h("p", { class: "muted" }, "Amending makes a new version and keeps this one." + (r.parts && r.parts.countersign ? " The amended report is countersigned again." : "")),
          h("a", { class: "btn ghost", href: "../#rep/" + r.id }, "Amend in the Ushers App")) : null,
        h("div", { class: "card" }, h("h3", {}, "History"), r.history.map(function (x) {
          return h("div", { class: "muted" }, C.timeLabel(x.at) + " · " + (x.from ? x.from + " → " : "") + x.to + (x.who ? " · " + x.who : "") + (x.note ? " · " + x.note : ""));
        })),
        R.versionsView(r.versions));
    }, failed);
  }

  /* ---- approvals -------------------------------------------------------- */

  function approvals() {
    loading();
    Promise.all([C.api("authorisations.list", { status: "pending" }), C.api("authorisations.list", {})]).then(function (r) {
      var pending = r[0].authorisations, all = r[1].authorisations.filter(function (a) { return a.status !== "pending"; }).slice(0, 30);
      var parts = [h("h1", {}, "Approvals")];
      if (!pending.length) parts.push(h("p", { class: "muted" }, "Nothing waiting."));
      pending.forEach(function (a) {
        var note = h("input", { placeholder: "e.g. Confirmed with the Head Usher" });
        var pin = pinInput("p-" + a.id), out = h("div");
        function decide(decision) {
          C.clear(out);
          C.api("authorisation.decide", { id: a.id, decision: decision, note: note.value, pin: pin.value }).then(function (x) {
            if (!x.ok) return out.appendChild(msg(x.message + (x.left !== undefined ? " " + x.left + " tries left." : ""), "bad"));
            approvals();
          }, function () { out.appendChild(msg("No connection. Deciding needs a signal, so your PIN can be checked.", "bad")); });
        }
        parts.push(h("div", { class: "card" }, h("b", {}, a.kindLabel), h("div", {}, a.about.title ? a.about.title + " · " + C.dateLabel(a.about.date) : ""),
          h("div", {}, "For: " + a.subject + (a.requestedBy && a.requestedBy !== a.subject ? " · asked by " + a.requestedBy : "")),
          a.about.rostered ? h("div", {}, "Rostered: " + a.about.rostered) : null,
          a.reason ? h("div", { class: "muted" }, a.reason) : null,
          a.about.reportId ? h("a", { href: "#report/" + a.about.reportId }, "See the report") : null,
          a.canDecide ? [h("label", {}, "Note"), note, h("label", { for: "p-" + a.id }, "Your PIN"), pin, h("p"),
            h("div", { class: "row" }, h("button", { onclick: function () { decide("approve"); } }, "Approve"),
              h("button", { class: "danger", onclick: function () { decide("reject"); } }, "Reject"))]
            : h("div", { class: "muted" }, "Somebody else must decide this one."), out));
      });
      if (all.length) {
        parts.push(h("h2", {}, "Decided"));
        parts.push(h("div", { class: "card" }, h("table", {}, all.map(function (a) {
          return h("tr", {}, h("td", {}, a.kindLabel), h("td", {}, a.subject), h("td", {}, a.status), h("td", {}, a.decidedBy || ""));
        }))));
      }
      show.apply(null, parts);
    }, failed);
  }

  /* ---- ushers and roles ------------------------------------------------- */

  function ushers(editing) {
    loading();
    USHERS = null;
    C.api("ushers.list").then(function (j) {
      /* Editing someone (their details and roles) is a screen of its own,
         opened at the top, so the form is never hidden down the list. */
      var one = editing ? j.ushers.filter(function (u) { return u.usherId === editing && canEdit(u, j); })[0] : null;
      if (one) {
        show(h("a", { class: "btn ghost", href: "#ushers" }, "← All ushers"), usherForm(one, j));
        window.scrollTo(0, 0);
        return;
      }
      var parts = [h("h1", {}, "Ushers")];
      if (j.canManage) parts.push(h("p", { class: "muted" }, "To make someone Head Usher, Assistant Head Usher" +
        (j.canGrantAny ? ", Treasurer or System Administrator" : "") + ", or to remove someone, tap Edit details and roles under their name."));
      if (j.canManage) parts.push(usherForm(null, j));
      /* Removed people go last, under their own heading. */
      var on = j.ushers.filter(function (u) { return u.active; }), off = j.ushers.filter(function (u) { return !u.active; });
      on.concat(off).forEach(function (u, i) {
        if (i === on.length) parts.push(h("h2", {}, "Removed"), h("p", { class: "muted" }, "They cannot sign in. To bring someone back, tap Edit details and roles and tick Active."));
        parts.push(h("div", { class: "card" }, h("div", { class: "row" }, h("b", { class: "grow" }, u.name), u.active ? null : h("span", { class: "chip bad" }, "Removed"),
            u.hasPin ? null : h("span", { class: "chip warn" }, "No PIN"),
            u.active && !u.alerts ? h("span", { class: "chip warn", title: "No phone has alerts on: they are emailed instead" }, "Alerts off") : null),
          h("div", {}, u.roles.map(function (r) { return h("span", { class: "chip" }, labelOf(r)); })),
          h("div", { class: "muted" }, [u.email, u.phone].filter(Boolean).join(" · ")),
          canEdit(u, j) ? h("a", { class: "btn ghost", href: "#ushers/" + encodeURIComponent(u.usherId) }, "Edit details and roles")
            : j.canManage ? h("p", { class: "muted" }, "Only a System Administrator can change or remove a Treasurer or System Administrator.") : null));
      });
      show.apply(null, parts);
    }, failed);
  }
  /* Mirrors the server: without roles.grant_any, nobody who is Treasurer or
     System Administrator can be edited, have their PIN reset or be removed. */
  function canEdit(u, j) {
    return j.canManage && (j.canGrantAny || u.roles.every(function (r) { return ["usher", "head_usher", "assistant_head_usher"].indexOf(r) !== -1; }));
  }
  function labelOf(r) { var x = CONF.roles.filter(function (y) { return y.key === r; })[0]; return x ? x.label : r; }

  function usherForm(u, j) {
    var name = h("input", { value: u ? u.name : "", placeholder: "e.g. John Smith" });
    var email = h("input", { type: "email", value: u ? u.email : "", placeholder: "e.g. john@example.org" });
    var phone = h("input", { type: "tel", value: u ? u.phone : "", placeholder: "e.g. 07700 900123" });
    var active = h("input", { type: "checkbox", checked: u ? u.active : true });
    var pin = pinInput(u ? "rp" : "np");
    var out = h("div");
    var roles = {};
    (u ? u.roles : ["usher"]).forEach(function (r) { roles[r] = true; });
    /* Roles can be given when someone is added, and changed later. Without
       roles.grant_any (the Head Usher and Assistant Head Usher) only Usher,
       Head Usher and Assistant Head Usher can be ticked; the server checks
       the same. */
    var roleBoxes = h("div", {}, h("label", {}, "Roles"), CONF.roles.map(function (r) {
      var allowed = j.canGrantAny || ["usher", "head_usher", "assistant_head_usher"].indexOf(r.key) !== -1;
      return h("label", { class: "check" }, h("input", { type: "checkbox", checked: !!roles[r.key], disabled: !allowed,
        onchange: function (e) { roles[r.key] = e.target.checked; } }), r.label);
    }), h("p", { class: "muted" }, "Head Usher and Assistant Head Usher open the Admin App and approve. " +
      (j.canGrantAny ? "" : "Only a System Administrator can give or take away Treasurer and System Administrator.")));
    return h("div", { class: "card" }, h("h2", {}, u ? "Edit " + u.name : "Add an usher"),
      h("label", {}, "Full name"), name, h("label", {}, "Email"), email, h("label", {}, "Phone"), phone,
      u ? h("label", { class: "check" }, active, "Active") : null, roleBoxes,
      h("p", { class: "muted" }, u
        ? "Reset PIN sets it back to their default PIN; at their next sign-in they are asked whether to keep it."
        : "They start on their default PIN; at their first sign-in they are asked whether to keep it."),
      h("label", {}, "Starting PIN (" + CONF.pinMax + " digits), only if they have no default PIN"), pin, h("p"),
      h("button", { onclick: function () {
        C.clear(out);
        var body = { usherId: u ? u.usherId : undefined, name: name.value, email: email.value, phone: phone.value, active: active.checked };
        if (!u && pin.value) body.pin = pin.value;
        var queued = false, rolesLater = false;
        C.send("usher.save", body, (u ? "Changes to " : "Add ") + (name.value || "an usher")).then(function (x) {
          if (!x.ok) throw new Error(x.message);
          queued = !!x.queued;
          var want = Object.keys(roles).filter(function (k) { return roles[k]; });
          /* Someone new starts as Usher; any other role ticked is given now.
             Added with no signal, they have no id yet, so the rest waits. */
          if (!u && !want.some(function (k) { return k !== "usher"; })) return [];
          if (!u && queued) { rolesLater = true; return []; }
          return Promise.all([C.send("usher.roles", { usherId: u ? u.usherId : x.usherId, roles: want }, "Roles for " + name.value)]);
        }).then(function (rs) {
          var bad = (rs || []).filter(function (x) { return !x.ok; })[0];
          if (bad) throw new Error(bad.message);
          if (queued || (rs || []).some(function (x) { return x.queued; })) {
            return out.appendChild(msg("No signal. Saved on this device; it is sent when the signal is back." +
              (rolesLater ? " They are added as an Usher: give the other roles once they appear in the list." : ""), "ok"));
          }
          location.hash = "#ushers"; ushers();
        }).catch(function (e) { out.appendChild(msg(e.network ? "No connection." : e.message, "bad")); });
      } }, u ? "Save" : "Add"), " ",
      u ? h("button", { class: "ghost", onclick: function () {
        C.clear(out);
        if (!confirm("Reset " + u.name + "'s PIN to their default PIN?")) return;
        var body = { usherId: u.usherId };
        if (pin.value) body.pin = pin.value;
        C.api("usher.resetPin", body).then(function (x) {
          if (!x.ok) throw new Error(x.message);
          pin.value = "";
          out.appendChild(msg(x.pinFrom === "default"
            ? "PIN reset to their default PIN. They are asked whether to keep it when they next sign in."
            : "PIN reset to the one you typed. They are asked whether to keep it when they next sign in.", "ok"));
        }).catch(function (e) { out.appendChild(msg(e.network ? "No connection. Resetting a PIN needs a signal." : e.message, "bad")); });
      } }, "Reset PIN") : null, " ",
      u && u.active ? h("button", { class: "danger", onclick: function () {
        C.clear(out);
        if (!confirm("Remove " + u.name + "?\n\nThey will no longer be able to sign in, every role but Usher is taken away and they come off every duty from today. " +
          "Their reports and dues stay on the record. You can bring them back by ticking Active.")) return;
        C.send("usher.remove", { usherId: u.usherId }, "Remove " + u.name).then(function (x) {
          if (!x.ok) throw new Error(x.message);
          if (x.queued) return out.appendChild(msg(x.message, "ok"));
          location.hash = "#ushers";
        }).catch(function (e) { out.appendChild(msg(e.network ? "No connection." : e.message, "bad")); });
      } }, "Remove " + u.name) : null, out);
  }

  /* ---- notifications ---------------------------------------------------- */

  /* The same notifications as the Ushers App's tab: filed reports, approval
     requests and the rest, kept until read. */
  function paintUnread(list) {
    C.bellSet(list.filter(function (x) { return !x.read; }).length);
  }
  function unread() { C.bellCheck(); }

  function notes() {
    loading();
    C.api("notifications.list").then(function (j) {
      if (!j.ok) return show(msg(j.message, "bad"));
      paintUnread(j.notifications);
      var parts = [h("div", { class: "row" }, h("h1", { class: "grow" }, "Notifications"),
        h("button", { class: "ghost", onclick: function () { C.send("notifications.read", { all: true }, "Mark notifications read").then(notes, failed); } }, "Mark all read"))];
      parts.push(alertsCard());
      if (!j.notifications.length) parts.push(h("p", { class: "muted" }, "Nothing yet."));
      j.notifications.forEach(function (n) {
        var link = n.refType === "report" ? "#report/" + n.refId : n.refType === "authorisation" ? "#approvals" :
                   n.refType === "event" ? "../#report/" + n.refId : "";
        parts.push(h("div", { class: "card", style: n.read ? "opacity:.7" : "" },
          h("div", { class: "row" }, h("b", { class: "grow" }, n.title), n.read ? null : h("span", { class: "chip warn" }, "New")),
          n.body ? h("div", {}, n.body) : null, h("div", { class: "muted" }, C.timeLabel(n.at)),
          h("div", { class: "row" }, link ? h("a", { class: "btn ghost", href: link, onclick: function () { C.send("notifications.read", { ids: [n.id] }, "Mark a notification read").then(unread, function () {}); } }, "Open") : null,
            n.read ? null : h("button", { class: "ghost", onclick: function () { C.send("notifications.read", { ids: [n.id] }, "Mark a notification read").then(notes, failed); } }, "Mark read"))));
      });
      show.apply(null, parts);
    }, failed);
  }

  /* Alerts on this phone or computer: the same notifications, as an alert. */
  function alertsCard() {
    var box = h("div", { class: "card" }, h("p", { class: "muted" }, "Checking alerts on this device…"));
    function paint(state, note) {
      C.clear(box);
      box.appendChild(h("h3", {}, "Alerts on this device"));
      if (state === "unsupported" || !PUSH_KEY) {
        box.appendChild(h("p", { class: "muted" }, C.iPhoneNotInstalled()
          ? "On iPhone: tap Share, then Add to Home Screen, and open Ushers from the Home Screen. Then turn alerts on here or in the Ushers App."
          : "This browser cannot show alerts. Notifications still appear here."));
      } else if (state === "blocked") {
        box.appendChild(h("p", { class: "muted" }, "Alerts are blocked for this app in the device's settings. Allow notifications for it there, then come back."));
      } else if (state === "on") {
        box.appendChild(h("div", { class: "row" }, h("span", { class: "grow" }, "On. New notifications also arrive as alerts."),
          h("button", { class: "ghost", onclick: function (e) {
            var b = e.target; b.disabled = true;
            C.alertsTest().then(function () { b.disabled = false; C.toast("A test alert is on its way to this device."); },
              function (x) { b.disabled = false; paint("on", x.network ? "No connection." : x.message); });
          } }, "Send a test alert"),
          h("button", { class: "ghost", onclick: function () { C.alertsOff().then(function () { paint("off"); }, function (e) { paint("on", e.message); }); } }, "Turn off")));
      } else {
        box.appendChild(h("div", { class: "row" }, h("span", { class: "grow" }, "Get an alert the moment a report is filed or an approval is needed."),
          h("button", { onclick: function () {
            C.alertsOn(PUSH_KEY).then(function () { paint("on"); }, function (e) { paint("off", e && e.message || "Could not turn alerts on."); });
          } }, "Turn on alerts")));
      }
      if (note) box.appendChild(msg(note, "bad"));
      C.bellState();
    }
    C.alertsState().then(function (s) { paint(s); }, function () { paint("unsupported"); });
    return box;
  }

  /* ---- message ---------------------------------------------------------- */

  function message() {
    var title = h("input", { placeholder: "e.g. Ushers meeting after service" });
    var body = h("textarea", { rows: "4", placeholder: "e.g. Please stay for ten minutes after the Second Service." });
    var out = h("div");
    show(h("h1", {}, "Message the ushers"), h("div", { class: "card" }, h("label", {}, "Title"), title, h("label", {}, "Message"), body, h("p"),
      h("button", { onclick: function () {
        C.clear(out);
        C.send("notify.send", { all: true, title: title.value, body: body.value }, "Message: " + (title.value || "to all ushers")).then(function (x) {
          out.appendChild(x.queued ? msg(x.message, "ok") : x.ok ? msg("Sent to " + x.sent + ".", "ok") : msg(x.message, "bad"));
        });
      } }, "Send to all active ushers"), out));
  }

  /* ---- audit and settings ---------------------------------------------- */

  function audit() {
    loading();
    C.api("audit.list").then(function (j) {
      show(h("h1", {}, "Audit (latest 200)"), h("div", { class: "card" }, h("table", {}, j.audit.map(function (a) {
        return h("tr", {}, h("td", {}, C.timeLabel(a.at)), h("td", {}, a.who), h("td", {}, a.action), h("td", { class: "muted" }, a.reason || ""));
      }))));
    }, failed);
  }

  function settings() {
    loading();
    C.api("config.get").then(function (j) {
      var parts = [h("h1", {}, "Settings")];
      if (window.UshersTesting && can("ushers.manage") && can("roles.grant_any")) parts.push(window.UshersTesting.card(CONF));
      parts.push(h("h2", {}, "Rules"), h("p", { class: "muted" }, "Each rule is stored on the server and written to the CONFIG tab. Values are JSON."));
      Object.keys(j.config).forEach(function (k) {
        var box = h("textarea", { rows: typeof j.config[k] === "object" && j.config[k] !== null ? "4" : "1" }, JSON.stringify(j.config[k], null, 1));
        var out = h("span");
        parts.push(h("div", { class: "card" }, h("b", {}, k), box, h("p"), h("button", { class: "ghost", onclick: function () {
          var v;
          try { v = JSON.parse(box.value); } catch (e) { out.textContent = " Not valid JSON."; return; }
          C.send("config.set", { key: k, value: v }, "Setting: " + k).then(function (x) { out.textContent = x.queued ? " Saved on this device; sent when the signal is back." : x.ok ? " Saved." : " " + x.message; });
        } }, "Save"), out));
      });
      show.apply(null, parts);
    }, failed);
  }

  start();
  /* The worker at the root, so this app opens with no signal next time. */
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {}); }
})();
</script>
</body>
</html>
